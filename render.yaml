services:
  - type: web
    name: geoagreste-dronetm
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    plan: starter
    disk:
      name: geoagreste-drone-data
      mountPath: /var/data
      sizeGB: 20
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: NODEODM_HOST
        sync: false
      - key: NODEODM_PORT
        value: 3000
      - key: NODEODM_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: '*'
