services:
  nodeodm:
    image: opendronemap/nodeodm:latest
    container_name: geoagreste-nodeodm
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - nodeodm_data:/var/www/data
    # Configure firewall/network access so only the Flask API can reach port 3000.
volumes:
  nodeodm_data:
